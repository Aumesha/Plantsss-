name: Build Android APK (Plants App)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Build Web Application Assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: 6. Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Initializing Android platform with Capacitor..."
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Configure Android SDK & Gradle Permissions
        run: |
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties
          chmod +x android/gradlew

      - name: 8. Build Android Debug APK with Gradle
        working-directory: ./android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.suppressUnsupportedCompileSdk=35,36

      - name: 9. Locate & Package APK
        run: |
          mkdir -p build-output
          APK_FILE=$(find android -name "*debug.apk" -o -name "app-*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" build-output/Plants-CropDoctor-debug.apk
            ls -lh build-output/
          else
            echo "APK not found. Searching build directory:"
            find android -name "*.apk" || true
            exit 1
          fi

      - name: 10. Upload APK Artifact (Download from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Plants-CropDoctor-Android-APK
          path: build-output/Plants-CropDoctor-debug.apk
          retention-days: 30
