name: Build Android APK (Plants App)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Build Web Application Assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: 6. Initialize & Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android platform not found. Creating Android platform with Capacitor..."
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Grant Execute Permission for Gradle
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: 8. Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: 9. Locate & Package APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build-output/Plants-CropDoctor-debug.apk
            ls -lh build-output/
          else
            echo "Error: APK not found in android/app/build/outputs/apk/debug"
            exit 1
          fi

      - name: 10. Upload APK Artifact (Download from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Plants-CropDoctor-Android-APK
          path: build-output/Plants-CropDoctor-debug.apk
          retention-days: 30

      - name: 11. Create GitHub Release (If tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Plants Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build-output/Plants-CropDoctor-debug.apk
