name: Build Android APK (Plants App)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Build Web Application Assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: 6. Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Initializing Android platform with Capacitor..."
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.suppressUnsupportedCompileSdk=35,36

      - name: 8. Upload APK Artifact (Download from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Plants-CropDoctor-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
