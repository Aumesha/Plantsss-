name: Build Android APK (Plants App)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / release)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 6. Build Web Application Assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: 7. Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Initializing Android platform..."
            npx cap add android
          fi
          npx cap sync android

      - name: 8. Set Gradle Permissions & Accept Licenses
        run: |
          chmod +x android/gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 9. Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

      - name: 10. Locate & Package APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build-output/Plants-CropDoctor-debug.apk
            ls -lh build-output/
          else
            echo "APK not found. Searching build directory:"
            find android/app/build/ -name "*.apk" || true
            exit 1
          fi

      - name: 11. Upload APK Artifact (Download from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Plants-CropDoctor-Android-APK
          path: build-output/Plants-CropDoctor-debug.apk
          retention-days: 30

      - name: 12. Create GitHub Release (If tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          name: Plants Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build-output/Plants-CropDoctor-debug.apk
